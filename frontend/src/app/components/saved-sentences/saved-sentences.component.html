<section class="panel">
  <header class="panel-header">
    <span class="step">4</span>
    <h2>Saved sentences</h2>
    <button type="button" class="refresh" (click)="refresh()" title="Refresh">
      ↻
    </button>
  </header>

  @if (loading) {
    <p class="muted">Loading…</p>
  } @else if (error) {
    <p class="error">{{ error }}</p>
  } @else if (sentences.length === 0) {
    <p class="muted">No sentences saved yet.</p>
  } @else {
    <ul class="sentence-list">
      @for (s of sentences; track s.id) {
        <li>
          <div class="text">{{ s.content }}</div>
          <div class="meta">
            <span class="timestamp">{{ s.updated_at | date:'short' }}</span>
            <button type="button" class="action" (click)="edit(s)">Edit</button>
            <button
              type="button"
              class="action danger"
              (click)="remove(s)"
            >Delete</button>
          </div>
        </li>
      }
    </ul>
  }
</section>
